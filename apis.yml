aid: pepperdata
name: Pepperdata
description: >-
  Pepperdata provides dynamic Kubernetes resource optimization and observability
  for data-intensive workloads, increasing cluster utilization, improving
  performance, and reducing cost in real time across Spark, MapReduce, Tez, and
  Kubernetes environments. Its REST API gives programmatic access to the same
  observability data available in the Pepperdata dashboard: time-series metrics
  with series breakdowns and filters (/m), application and job details including
  counters and cost/performance tuning recommendations (/jobdetails), and full
  CRUD over metric alarms (/alarms). Authentication uses a custom API-key header.
  Pepperdata is a portfolio company of Wing Venture Capital.
